name: Generate advertisement manifest

on:
  push:
    paths:
      - "assets/images/ads/carousel/*.png"
      - "assets/images/ads/carousel/*.PNG"
      - "assets/images/ads/carousel/links.json"
      - "scripts/generate-ad-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advertisement-manifest
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-ad-manifest.mjs
      - name: Commit updated manifest
        shell: bash
        run: |
          if git diff --quiet -- assets/images/ads/carousel/manifest.json; then
            echo "Advertisement manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/ads/carousel/manifest.json
          git commit -m "Update advertisement manifest"
          git push
