<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BORail" />
  <title>BORail Map Viewer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/branding/apple-touch-icon-v79.png" />
  <link rel="icon" type="image/png" href="assets/images/branding/favicon.png" />
  <link rel="stylesheet" href="assets/css/map-viewer.css" />
  <link rel="stylesheet" href="assets/css/app-shell.css" />
</head>
<body>
  <header class="viewer-header">
    <a class="back-button" href="map.html">‹ Back to Maps</a>
    <h1 id="mapTitle">BORail Map</h1>
    <a id="downloadMap" href="assets/maps/borail-flatlands-route-map.pdf" download>Download PDF</a>
  </header>
  <main id="mapViewport" aria-label="Zoomable system map" aria-busy="true" tabindex="0">
    <img id="mapImage" alt="" draggable="false" hidden />
    <p id="mapLoading" role="status">Loading map…</p>
  </main>
  <footer class="viewer-toolbar">
    <span>Pinch to zoom · Drag to move</span>
    <div class="zoom-controls" aria-label="Map zoom controls">
      <button id="mapZoomOut" type="button" aria-label="Zoom out" disabled>−</button>
      <output id="mapZoomLevel" aria-label="Zoom level">100%</output>
      <button id="mapZoomIn" type="button" aria-label="Zoom in" disabled>+</button>
      <button id="mapFit" type="button" disabled>Fit</button>
    </div>
  </footer>
  <script src="assets/js/map-viewer.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
