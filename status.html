<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BORail Line & Elevator Status</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BORail" />
  <meta name="theme-color" content="#0a0a12" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/branding/apple-touch-icon-v79.png" />

<body>
  <header>
    <div class="wrap">
      <div class="title">BORail - Status</div>
      <div class="subtle">Live line conditions - Based on EST/EDT - Tap a disrupted service to see details.</div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid">
      <div class="card">
        <div class="name" style="margin-bottom:8px;">Line Status</div>
        <div id="operationsNotices" class="status-list" aria-live="polite"></div>
        <div id="statusList" class="status-list"></div>
      </div>

      <section class="card station-status-card" aria-labelledby="stationStatusTitle">
        <h2 id="stationStatusTitle" class="name">Station Status</h2>
        <div id="stationStatusList" class="status-list" aria-live="polite">
          <p class="station-status-empty">Checking station status…</p>
        </div>
      </section>

      <div class="card elevator-card">
        <div class="elevator-card-top">
          <div>
            <div class="name">Elevator Status</div>
            <div class="subtle">Active elevator outages and recently repaired elevators.</div>
          </div>
          <div class="elevator-count-pill" id="elevatorOutageSummary" aria-live="polite"></div>
        </div>
        <div id="elevatorStatusList" class="elevator-status-list"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" role="navigation" aria-label="Primary">

        <img src="assets/images/navigation/timetable.png" alt="" width="26" height="26" />

    <a href="mybocard.html">

      </div>
    </a>
    <a href="map.html">
      <div class="item">
        <img src="assets/images/navigation/map.png" alt="" width="26" height="26" />
        <span>Map</span>
      </div>
    </a>
    <a href="https://borail-smooth-stop.pages.dev/" target="_blank" rel="noopener">
      <div class="item">
        <img src="assets/images/navigation/game-controller.svg" alt="" width="26" height="26" />
        <span>Game</span>
      </div>
    </a>
    <a class="active" href="status.html">
      <div class="item">
        <img src="assets/images/navigation/status.png" alt="" width="26" height="26" />
        <span>Status</span>
      </div>
    </a>
    <a href="settings.html">
      <div class="item">
        <img src="assets/images/navigation/settings.svg" alt="" width="26" height="26" />
        <span>Settings</span>
      </div>
    </a>
  </nav>
  <script src="assets/js/time.js?v=83"></script>

  <script src="assets/js/notification-config.js"></script>

  <script src="assets/js/operations-client.js"></script>
  <script type="module" src="assets/js/schedule.js?v=83"></script>
  <script type="module" src="assets/js/status.js?v=83"></script>
  <script src="assets/js/pwa.js?v=83"></script>
